<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>Phrasebook</title></head>
  <body>
    <main>
      <header><strong>Phrasebook</strong><button id="settings" type="button" aria-label="Settings">⚙</button></header>
      <label for="mode">Dictionary mode</label>
      <select id="mode"><option value="en-vi">English → Vietnamese</option><option value="en-en">English → English</option><option value="vi-en">Vietnamese → English</option></select>
      <p id="dictionary" role="status">Checking dictionaries…</p>
      <button id="install" type="button">Download this dictionary</button>
      <button id="install-all" class="secondary" type="button">Download / update all dictionaries</button>
      <button id="flashcards" class="secondary" type="button">Open flashcards</button>
      <button id="manager" class="secondary" type="button">Downloads and sync</button>
      <p id="account" role="status"></p>
      <button id="open-settings" class="text-button" type="button">Sign-in and settings</button>
      <p id="message" role="status"></p>
    </main>
    <script type="module" src="popup.mjs"></script>
  </body>
</html>
