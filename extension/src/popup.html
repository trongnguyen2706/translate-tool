<!doctype html>
<html lang="vi">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>Phrasebook</title></head>
  <body>
    <main>
      <header><strong>Phrasebook</strong><button id="settings" type="button" aria-label="Cài đặt">⚙</button></header>
      <label for="mode">Chế độ tra</label>
      <select id="mode"><option value="en-vi">Anh → Việt</option><option value="en-en">Anh → Anh</option><option value="vi-en">Việt → Anh</option></select>
      <p id="dictionary" role="status">Đang kiểm tra từ điển…</p>
      <button id="install" type="button">Tải từ điển cho chế độ này</button>
      <button id="flashcards" class="secondary" type="button">Mở Flashcard trên web</button>
      <p id="account" role="status"></p>
      <button id="open-settings" class="text-button" type="button">Đăng nhập và cài đặt</button>
      <p id="message" role="status"></p>
    </main>
    <script type="module" src="popup.mjs"></script>
  </body>
</html>
