<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="options.css"><title>Phrasebook settings</title></head>
  <body>
    <main>
      <h1>Phrasebook settings</h1>
      <p>Configure your Phrasebook connection. Use a public Supabase publishable key, never a service role key.</p>
      <form id="settings">
        <label>Phrasebook web address<input id="appOrigin" type="url" required placeholder="https://phrasebook.example.com"></label>
        <label>Supabase URL<input id="supabaseUrl" type="url" required placeholder="https://project.supabase.co"></label>
        <label>Supabase publishable / anon key<input id="supabaseAnonKey" type="password" required autocomplete="off"></label>
        <label>Google OAuth client ID (Web application)<input id="googleClientId" type="text" required placeholder="...apps.googleusercontent.com"></label>
        <label>Dictionary manifest URL<input id="manifestUrl" type="url" placeholder="https://dictionary.example.com/manifest.json"></label>
        <div class="actions"><button type="submit">Save settings</button><button id="signIn" type="button">Sign in with Google</button></div>
        <button id="signOut" class="secondary" type="button">Sign out</button>
      </form>
      <p class="hint">Your email is sent during sign-in. Words and source context are sent when you save or request AI enrichment. Downloaded dictionaries work locally.</p>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="options.mjs"></script>
  </body>
</html>
