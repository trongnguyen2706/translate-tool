<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Phrasebook extension interaction regression fixture</title>
<link rel="stylesheet" href="/content.css">
<style>
  body { margin:24px; background:#f1f5f9; color:#172554; font:16px/1.6 system-ui; }
  button { padding:8px 14px; cursor:pointer; }
  #movie_player { position:relative; z-index:0; height:340px; width:760px; max-width:100%; background:#334155; overflow:hidden; user-select:none; }
  #movie_player:fullscreen { width:100vw; height:100vh; }
  #movie_player video { width:100%; height:100%; }
  .ytp-caption-window-container { position:absolute; inset:0; pointer-events:none; }
  .caption-window { position:absolute; bottom:45px; left:10%; z-index:41; pointer-events:auto; }
  .ytp-caption-segment { background:#000c; color:white; font-size:28px; }
  .ytp-chrome-bottom { position:absolute; bottom:0; width:100%; height:100px; z-index:59; }
  .fixture-toolbar { position:absolute; top:10px; left:10px; z-index:2300; color:white; }
  #page-copy { position:relative; z-index:100; font-size:26px; }
  #results { white-space:pre-wrap; }
</style>
<h1>Extension UI regression fixture</h1>
<p>Simulated player, dictionary and video state. No network/auth requests. Double-click title or drag captions to select text.</p>
<div id="movie_player">
  <video class="html5-main-video"></video>
  <div class="ytp-caption-window-container"><div class="caption-window"><span class="ytp-caption-segment">An eco-friendly company specifically for you</span></div></div>
  <div class="ytp-chrome-bottom"></div>
  <div class="fixture-toolbar"><button id="fullscreen">Enter fullscreen</button> <button id="run">Run interaction checks</button> <button id="preview">Preview hover</button> <button id="preview-form">Preview word forms</button> <button id="preview-learner">Preview learner meaning</button> <span id="screen-state">Normal view</span></div>
</div>
<h2 id="page-copy">Aesthetic unboxing and review</h2>
<pre id="results" role="status">Ready</pre>
<script>
  const calls = [];
  let lookupDelay = 0, statusDelay = 0, saveDelay = 0;
  let statusItems = [], storageListener;
  const playback = { paused:false, resumes:0 };
  const video = document.querySelector('video');
  Object.defineProperties(video, {
    paused: { get:() => playback.paused },
    currentTime: { get:() => 42 },
    pause: { value:() => { playback.paused = true; } },
    play: { value:() => { playback.paused = false; playback.resumes++; video.dispatchEvent(new Event('play')); return Promise.resolve(); } },
  });
  window.chrome = {
    runtime: { sendMessage:async (request) => {
      calls.push(request);
      const delay = request.type === 'lookup' ? lookupDelay : request.type === 'read-status' ? statusDelay : request.type === 'save-capture' ? saveDelay : 0;
      if (delay) await new Promise(resolve => setTimeout(resolve, delay));
      if (request.type === 'get-config') return { ok:true, data:{ mode:'en-vi', appOrigin:'https://phrasebook.invalid' } };
      if (request.type === 'read-status') return { ok:true, data:{ state:'unknown', items:statusItems } };
      if (request.type === 'save-capture') return { ok:true, data:{ queued:true } };
      if (request.type === 'enrich') return { ok:true, data:{ mode:request.mode, definitionLanguage:'vi', fields:{ examples:['This is a fixture example.'], ipa:'/test/' } } };
      if (request.type === 'lookup' && request.term === 'weaker') return {ok:true,data:{mode:'en-en',dataVersion:'learner-fixture',result:{basicSenseCount:2,senses:[
        {id:'weak-strength',partOfSpeech:'adj',learner:true,baseForm:'weak',formNote:'Comparative of weak (used to compare)',definitions:['Weak is used to describe something that does not have a lot of strength.']},
        {id:'weak-taste',partOfSpeech:'adj',learner:true,baseForm:'weak',definitions:['Something that is weak does not have a strong taste.']},
        ...Array.from({length:24},(_,i)=>({id:'special-'+i,partOfSpeech:'adj',usageLabels:['logic'],definitions:['Specialist dictionary meaning '+i+': '+('A detailed explanation about formal logic. ').repeat(8)]}))
      ]}}};
      if (request.type === 'lookup' && request.term === 'excuses') return { ok:true, data:{ mode:'en-en', dataVersion:'forms-pack', result:{ senses:[
        { id:'form:noun', partOfSpeech:'noun', baseForm:'excuse', formNote:'Plural of excuse', formStatus:'resolved', formDefinitions:['plural of excuse'], definitions:['A reason given to explain a mistake.'], examples:['That is a poor excuse.'], examplesFromBase:true },
        { id:'form:verb', partOfSpeech:'verb', baseForm:'excuse', formNote:'Present form of excuse (he/she/it)', formStatus:'resolved', definitions:['To forgive someone.'] }
      ] } } };
      if (request.type === 'lookup' && request.term === 'eco-friendly') return { ok:true, data:{ mode:request.mode, dataVersion:'new-pack', result:{ senses:[
        { id:'eco-friendly:adj:0', dataVersion:'saved-original-pack', partOfSpeech:'adj', definitions:['thân thiện với môi trường'] }
      ] } } };
      if (request.type === 'lookup') return { ok:true, data:{ mode:request.mode, result:{ senses:[
        { id:'one', partOfSpeech:'adv', definitions:['một cách cụ thể; đặc biệt'], ipa:'/spəˈsɪfɪkli/' },
        { id:'two', partOfSpeech:'adv', definitions:['chính xác; rõ ràng'] }
      ] } } };
      return { ok:false, error:'Fixture does not implement this operation' };
    } },
    storage: { onChanged: { addListener(listener) { storageListener = listener; } } },
  };
</script>
<script src="/content.js"></script>
<script>
  const host = document.querySelector('#phrasebook-extension-root');
  const shadow = host.shadowRoot;
  const tick = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  const fire = (node, type, options = {}) => node.dispatchEvent(new MouseEvent(type, { bubbles:true, composed:true, ...options }));
  const escape = () => document.dispatchEvent(new KeyboardEvent('keydown', { key:'Escape', bubbles:true }));
  const word = () => document.querySelector('[data-pbx-word="specifically"]');
  const lookupCount = () => calls.filter(call => call.type === 'lookup').length;
  const chooseSense = (index) => {
    if (!shadow.querySelector('.pbx-choice[data-sense-index]')) shadow.querySelector('[aria-label="Choose a meaning"]').click();
    shadow.querySelector(`[data-sense-index="${index}"]`).click();
  };
  document.querySelector('#preview').onclick = () => {
    escape(); window.getSelection().removeAllRanges();
    const target = document.querySelector('[data-pbx-word="eco-friendly"]');
    const rect = target.getBoundingClientRect();
    fire(target, 'pointermove', { clientX:rect.left+rect.width/2, clientY:rect.top+rect.height/2 });
  };
  document.querySelector('#preview-form').onclick = async () => {
    escape(); window.getSelection().removeAllRanges(); statusItems = [];
    document.querySelector('.ytp-caption-segment').textContent = 'She makes excuses'; await tick();
    fire(document.querySelector('[data-pbx-word="excuses"]'), 'click');
  };
  document.querySelector('#preview-learner').onclick = async () => {
    escape(); window.getSelection().removeAllRanges(); statusItems = [];
    document.querySelector('.ytp-caption-segment').textContent = 'The signal gets weaker'; await tick();
    fire(document.querySelector('[data-pbx-word="weaker"]'), 'click');
  };
  const selectWord = (node, start, end) => {
    const selection = window.getSelection();
    selection.removeAllRanges();
    const range = document.createRange();
    range.setStart(node.firstChild, start); range.setEnd(node.firstChild, end);
    selection.addRange(range);
    document.dispatchEvent(new Event('selectionchange'));
  };
  document.querySelector('#fullscreen').onclick = async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.querySelector('#movie_player').requestFullscreen();
    } catch (error) {
      document.querySelector('#screen-state').textContent = 'Fullscreen unavailable: ' + error.message;
    }
  };
  document.addEventListener('fullscreenchange', () => {
    document.querySelector('#screen-state').textContent = document.fullscreenElement ? 'Fullscreen' : 'Normal view';
    document.querySelector('#fullscreen').textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Enter fullscreen';
  });
  document.querySelector('#run').onclick = async () => {
    const results = [];
    const check = (condition, name) => { if (!condition) throw new Error(name); results.push('PASS ' + name); };
    try {
      escape(); window.getSelection().removeAllRanges();
      const w = word(); const rect = w.getBoundingClientRect();
      const point = { clientX:rect.left+rect.width/2, clientY:rect.top+rect.height/2 };
      check(host.parentElement === (document.fullscreenElement || document.documentElement), 'Overlay mounts outside player except in fullscreen');
      check(getComputedStyle(w).userSelect === 'text', 'Caption words allow native text selection');
      check(document.elementFromPoint(point.clientX, point.clientY) === w, 'Caption words are above the player controls');
      const baseStyle = getComputedStyle(w);
      const originalStyle = { color:baseStyle.color, fontSize:baseStyle.fontSize, width:rect.width, height:rect.height };
      fire(w, 'pointermove', point);
      check(w.classList.contains('pbx-hover'), 'Direct caption hover responds in the same event without waiting for a frame');
      fire(document.querySelector('.ytp-chrome-bottom'), 'pointermove', point); await tick();
      check(w.classList.contains('pbx-hover'), 'Coordinate hover highlights the exact caption word');
      await Promise.all(w.getAnimations().map(animation => animation.finished));
      check(getComputedStyle(w).backgroundColor === 'rgba(56, 189, 248, 0.14)', 'Hover uses a translucent blue background');
      check(getComputedStyle(w).color === 'rgb(125, 211, 252)' && getComputedStyle(w).fontSize === originalStyle.fontSize, 'Hover changes text to cyan without changing font size');
      check(w.getBoundingClientRect().width === originalStyle.width && w.getBoundingClientRect().height === originalStyle.height, 'Hover does not shift caption layout');
      check(getComputedStyle(w).boxShadow === 'none', 'Color feedback replaces the underline');
      playback.paused = false;
      fire(w, 'click', point); await tick();
      check(playback.paused && shadow.querySelector('.pbx-definition'), 'Single click pauses video and shows basic definition');
      const card = shadow.querySelector('.pbx-card'); const box = card.getBoundingClientRect();
      check(getComputedStyle(card).backgroundColor === 'rgb(255, 255, 255)', 'Popup has an opaque white background');
      check(document.elementFromPoint(box.left+box.width/2, box.top+box.height/2) === host, 'Popup paints above page text and controls');
      const before = lookupCount();
      // A popup control at caption coordinates must not click the word behind it.
      fire(shadow.querySelector('.pbx-sense'), 'click', point);
      check(lookupCount() === before, 'Popup clicks cannot trigger a caption underneath');
      const resumes = playback.resumes; escape();
      check(!playback.paused && playback.resumes === resumes+1, 'Closing resumes a video paused by the extension');
      playback.paused = true; fire(w, 'click', point); await tick(); escape();
      check(playback.paused && playback.resumes === resumes+1, 'A video already paused by the user stays paused');
      const title = document.querySelector('#page-copy');
      fire(title, 'mousedown'); selectWord(title, 10, 18); fire(title, 'mouseup', { detail:2 });
      check(shadow.querySelector('.pbx-action')?.getAttribute('aria-label') === 'Look up unboxing', 'Selected YouTube page text offers Tra');
      shadow.querySelector('.pbx-action').click(); await tick();
      check(shadow.querySelector('.pbx-term')?.textContent === 'unboxing', 'Tra opens the selected text'); escape();
      fire(title, 'mousedown'); fire(title, 'mouseup', { detail:1 });
      check(!shadow.querySelector('.pbx-action'), 'A plain click does not resurrect Tra for an old selection');
      fire(w, 'mousedown'); selectWord(w, 0, w.textContent.length); fire(w, 'mouseup', { detail:2, ...point }); fire(w, 'click', point);
      check(shadow.querySelector('.pbx-action') && !shadow.querySelector('.pbx-card'), 'Selecting a caption offers Tra without automatically looking up');
      playback.paused = false; shadow.querySelector('.pbx-action').click(); await tick();
      check(playback.paused && shadow.querySelector('.pbx-term')?.textContent === 'specifically', 'Tra on caption selection pauses and opens the selected word');
      escape(); window.getSelection().removeAllRanges();
      const segment = w.closest('.ytp-caption-segment');
      const original = segment.textContent;
      segment.textContent = 'Rolling captions now'; await tick();
      check(segment.querySelector('[data-pbx-word="Rolling"]') && segment.dataset.pbxOriginal === 'Rolling captions now', 'Reused caption segments wrap the new cue instead of stale text');
      segment.textContent = 'Rolling captions now'; await tick();
      check(segment.querySelector('[data-pbx-word="Rolling"]'), 'Replacing a caption with identical plain text restores interactive words');
      segment.textContent = original; await tick();
      const eco = segment.querySelector('[data-pbx-word="eco-friendly"]');
      check(eco?.textContent === 'eco-friendly' && !segment.querySelector('[data-pbx-word="friendly"]'), 'A hyphenated compound is one clickable caption token');
      fire(eco, 'mousedown'); fire(eco, 'click'); await tick();
      check(shadow.querySelector('.pbx-term')?.textContent === 'eco-friendly', 'Clicking a compound looks up its complete term');
      check(eco.classList.contains('pbx-active'), 'The word stays marked while its popup is open');
      escape();
      check(!eco.classList.contains('pbx-active'), 'Closing the popup clears its active word mark');
      fire(eco, 'mousedown'); selectWord(eco, 0, 3); fire(eco, 'mouseup', { detail:2 });
      check(window.getSelection().toString() === 'eco-friendly', 'Double-click selection expands from eco to the entire compound');
      check(shadow.querySelector('.pbx-action')?.getAttribute('aria-label') === 'Look up eco-friendly', 'Double-click offers Tra for the entire compound');
      const nativeRange = document.createRange();
      nativeRange.setStart(eco.firstChild, 4); nativeRange.setEnd(eco.nextSibling, 1);
      fire(eco, 'mousedown'); window.getSelection().removeAllRanges(); window.getSelection().addRange(nativeRange);
      fire(eco, 'mouseup', { detail:2 });
      check(window.getSelection().toString() === 'eco-friendly' && shadow.querySelector('.pbx-action')?.getAttribute('aria-label') === 'Look up eco-friendly', 'Native double-click with trailing whitespace still selects the whole compound');
      shadow.querySelector('.pbx-action').click(); await tick();
      check(shadow.querySelector('.pbx-term')?.textContent === 'eco-friendly' && eco.classList.contains('pbx-active'), 'Tra marks and opens the selected compound');
      escape(); window.getSelection().removeAllRanges();
      const tokenSample = "well-known mother-in-law don't eco‐friendly eco‑friendly word—word word–word COVID-19";
      segment.textContent = tokenSample; await tick();
      check(JSON.stringify([...segment.querySelectorAll('.pbx-word')].map(node => node.textContent)) === JSON.stringify(['well-known', 'mother-in-law', "don't", 'eco‐friendly', 'eco‑friendly', 'word', 'word', 'word', 'word', 'COVID-19']), 'Compounds and contractions remain whole; en/em dashes separate words');
      check(segment.textContent === tokenSample, 'Tokenization preserves the exact source caption');
      const unicode = segment.querySelector('[data-pbx-word="eco‑friendly"]');
      fire(unicode, 'mousedown'); fire(unicode, 'click'); await tick();
      check(shadow.querySelector('.pbx-term')?.textContent === 'eco-friendly' && calls.filter(call => call.type === 'lookup').at(-1)?.term === 'eco-friendly', 'A non-breaking hyphen uses the standard dictionary lookup key');
      shadow.querySelector('.pbx-primary').click(); await tick();
      const capture = calls.filter(call => call.type === 'save-capture').at(-1)?.capture;
      check(capture?.term === 'eco-friendly' && capture.queryTerm === 'eco‑friendly' && capture.context === tokenSample, 'Saving keeps a canonical compound and its original query/context');
      check(capture?.selectedSense?.dataVersion === 'saved-original-pack', 'Saving a personal cached sense keeps its original version after the active pack changes');
      check(!calls.some(call => call.type === 'enrich'), 'Hover and compound lookup never invoke AI');
      escape(); segment.textContent = original; await tick();
      // Regression from the user's recording: look up text under the player,
      // then let loading and saved-status renders change the card beneath the pointer.
      lookupDelay = 450; statusDelay = 150;
      fire(title, 'mousedown'); selectWord(title, 10, 18); fire(title, 'mouseup', { detail:2 });
      shadow.querySelector('.pbx-action').click();
      fire(shadow.querySelector('.pbx-card'), 'pointerleave');
      await new Promise(resolve => setTimeout(resolve, 700));
      check(shadow.querySelector('.pbx-term')?.textContent === 'unboxing' && shadow.querySelector('.pbx-definition'), 'Lookup survives delayed data and layout-driven pointerleave');
      check(shadow.querySelector('.pbx-close')?.getAttribute('aria-label') === 'Close' && [...shadow.querySelectorAll('button')].some(button => button.textContent === 'Fill with AI'), 'Lookup controls use English while dictionary definitions retain their language');
      lookupDelay = 0; statusDelay = 0;
      fire(document.body, 'pointermove', { clientX:innerWidth-2, clientY:2 });
      // Replace the word before the old dismissal timeout can fire.
      fire(word(), 'mousedown'); fire(word(), 'click'); await tick();
      await new Promise(resolve => setTimeout(resolve, 350));
      check(shadow.querySelector('.pbx-term')?.textContent === 'specifically', 'A pending dismissal cannot close a newly opened word');
      const previousResumes = playback.resumes;
      const company = segment.querySelector('[data-pbx-word="company"]');
      fire(company, 'pointerdown'); fire(company, 'click'); await tick();
      check(playback.paused && playback.resumes === previousResumes && shadow.querySelector('.pbx-term')?.textContent === 'company', 'Switching caption words preserves the pause without a play/pause flicker');
      const stableCard = shadow.querySelector('.pbx-card');
      let stableRect = stableCard.getBoundingClientRect();
      const inCard = () => fire(stableCard, 'pointermove', { clientX:stableRect.left+20, clientY:stableRect.top+20 });
      fire(document.body, 'pointermove', { clientX:innerWidth-2, clientY:2 });
      inCard(); await new Promise(resolve => setTimeout(resolve, 350));
      check(shadow.querySelector('.pbx-card') === stableCard, 'Entering the popup cancels a pending dismissal');
      // Re-render on a sense change; no pointer movement means no auto-close.
      chooseSense(1);
      fire(stableCard, 'pointerleave'); await new Promise(resolve => setTimeout(resolve, 350));
      check(shadow.querySelector('.pbx-card') === stableCard, 'Changing meanings does not make the popup disappear');
      const expand = [...shadow.querySelectorAll('button')].find(button => button.textContent === 'Expand'); expand.click();
      fire(document.body, 'pointermove', { clientX:innerWidth-2, clientY:2 }); await new Promise(resolve => setTimeout(resolve, 350));
      check(shadow.querySelector('.pbx-card')?.dataset.expanded === 'true', 'Expanded details stay open after moving away');
      [...shadow.querySelectorAll('button')].find(button => button.textContent === 'Collapse').click();
      stableRect = stableCard.getBoundingClientRect(); inCard();
      statusDelay = 150;
      chooseSense(0);
      saveDelay = 450; const savingButton = shadow.querySelector('.pbx-primary'); savingButton.click();
      fire(document.body, 'pointermove', { clientX:innerWidth-2, clientY:2 }); await new Promise(resolve => setTimeout(resolve, 200));
      check(shadow.querySelector('.pbx-primary') === savingButton && savingButton.disabled, 'A late saved-status response cannot replace controls during Save');
      await new Promise(resolve => setTimeout(resolve, 300));
      check(shadow.querySelector('.pbx-card') && shadow.querySelector('.pbx-primary')?.textContent === 'Saved', 'A pending local save keeps the popup open and reports success in English');
      saveDelay = 0; statusDelay = 0;
      [...shadow.querySelectorAll('button')].find(button => button.textContent === 'Fill with AI').click(); await tick();
      check(calls.filter(call => call.type === 'enrich').at(-1)?.fields.every(field => ['definitions','ipa','examples','synonyms','antonyms','collocations'].includes(field)), 'English missing-field labels preserve the AI request schema');
      // A continuing stream of movement outside must not perpetually restart the close timer.
      for (let i=0;i<8;i++) { fire(document.body, 'pointermove', { clientX:innerWidth-2, clientY:2 }); await new Promise(resolve => setTimeout(resolve, 50)); }
      check(!shadow.querySelector('.pbx-card'), 'The popup closes after actually leaving both the word and popup');
      statusItems = [{id:'existing-one',term:'specifically',meaning_vi:'một cách cụ thể; đặc biệt',meaning_en:'',has_flashcard:true}];
      fire(word(),'click'); await tick();
      check(shadow.querySelector('.pbx-primary').textContent === 'Add context' && !shadow.querySelector('.pbx-primary').disabled,'A saved meaning can add a new context without resetting its flashcard');
      escape(); statusItems[0].has_flashcard = false; fire(word(),'click'); await tick();
      check(shadow.querySelector('.pbx-primary').textContent === 'Add flashcard','A saved word without a flashcard offers to create one');
      escape(); statusItems = [{...statusItems[0],meaning_vi:'nghĩa khác'}]; fire(word(),'click'); await tick();
      const link = shadow.querySelector('[aria-label="Link to an existing meaning"]');
      check(link && link.value === '', 'An unmatched dictionary sense defaults to a separate meaning');
      link.value = 'existing-one'; link.dispatchEvent(new Event('change')); shadow.querySelector('.pbx-primary').click(); await tick();
      check(calls.filter(call=>call.type==='save-capture').at(-1).capture.existingItemId === 'existing-one', 'Explicitly linking an existing meaning sends the selected ID');
      escape(); statusItems = [];
      fire(word(),'click'); await tick(); const beforeNavigation = playback.resumes;
      document.dispatchEvent(new Event('yt-navigate-start')); await tick();
      check(!shadow.querySelector('.pbx-card') && playback.resumes === beforeNavigation,'SPA navigation closes stale lookup without resuming a different video');
      const captionBeforeDisable = segment.textContent;
      storageListener({youtubeEnabled:{newValue:false}},'local'); await tick();
      check(!segment.querySelector('.pbx-word') && segment.textContent === captionBeforeDisable,'Disabling YouTube interactions restores the exact original caption');
      storageListener({youtubeEnabled:{newValue:true}},'local'); await tick();
      check(segment.querySelector('.pbx-word'),'Re-enabling YouTube interactions restores clickable words');
      window.getSelection().removeAllRanges();
      if (!document.fullscreenElement) {
        // Exercise the lifecycle handler even when browser automation lacks a
        // user activation for real fullscreen. This does not test fullscreen rendering.
        Object.defineProperty(document, 'fullscreenElement', { configurable:true, value:document.querySelector('#movie_player') });
        document.dispatchEvent(new Event('fullscreenchange')); await tick();
        check(host.parentElement === document.querySelector('#movie_player'), 'Simulated fullscreen entry mounts the overlay inside the fullscreen element');
        delete document.fullscreenElement;
        document.dispatchEvent(new Event('fullscreenchange')); await tick();
        check(host.parentElement === document.documentElement, 'Simulated fullscreen exit restores the overlay outside the player');
      }
      escape(); statusItems = []; segment.textContent = 'She makes excuses'; await tick();
      fire(segment.querySelector('[data-pbx-word="excuses"]'),'click'); await tick();
      check(shadow.querySelector('.pbx-definition')?.textContent === 'A reason given to explain a mistake.', 'Inflected words show a real base meaning in the small popup');
      check(shadow.querySelector('.pbx-form')?.textContent === 'Plural of excuse', 'Word form is a separate readable note');
      check(shadow.querySelector('.pbx-example-label')?.textContent === 'Example with excuse', 'Base-word examples are clearly labeled');
      shadow.querySelector('[aria-label="Choose a meaning"]').click();
      check(shadow.querySelector('[data-sense-index="1"]').textContent.includes('To forgive someone.'), 'Meaning choices contain actual definitions instead of grammar references');
      chooseSense(1); await tick();
      check(shadow.querySelector('.pbx-definition').textContent === 'To forgive someone.' && shadow.querySelector('.pbx-form').textContent.includes('he/she/it'), 'Changing part of speech updates both meaning and grammar note');
      [...shadow.querySelectorAll('button')].find(button=>button.textContent==='Expand').click();
      check(shadow.querySelector('.pbx-detail').textContent.includes('Base word') && shadow.querySelector('.pbx-detail').textContent.includes('excuse'), 'Expanded details include the base word');
      shadow.querySelector('.pbx-primary').click(); await tick();
      const formCapture = calls.filter(call=>call.type==='save-capture').at(-1).capture;
      check(formCapture.term === 'excuses' && formCapture.selectedSense.baseForm === 'excuse' && formCapture.selectedSense.definitions[0] === 'To forgive someone.', 'Saving retains the clicked word, selected base sense and relationship');
      escape(); segment.textContent = 'The signal gets weaker'; await tick();
      fire(segment.querySelector('[data-pbx-word="weaker"]'),'click'); await tick();
      check(shadow.querySelector('.pbx-definition').textContent.includes('strength') && shadow.querySelector('.pbx-source').textContent === 'Simple English definition','Weaker starts with a learner definition instead of slang or technical logic');
      check(!shadow.querySelector('.pbx-choices') && !shadow.querySelector('select[aria-label="Choose a meaning"]'),'A large dictionary entry does not open an enormous native dropdown');
      shadow.querySelector('[aria-label="Choose a meaning"]').click();
      check(shadow.querySelectorAll('[data-sense-index]').length === 2,'Only the two learner choices appear initially; technical meanings stay behind More');
      [...shadow.querySelectorAll('.pbx-choice')].find(button=>button.textContent.startsWith('More dictionary meanings')).click();
      const choiceBounds = shadow.querySelector('.pbx-choices').getBoundingClientRect();
      check(shadow.querySelectorAll('[data-sense-index]').length===26 && choiceBounds.height<=191 && choiceBounds.width<=shadow.querySelector('.pbx-card').getBoundingClientRect().width,'All meanings stay in a bounded scrolling panel inside the card');
      chooseSense(1); await tick();
      check(shadow.querySelector('.pbx-definition').textContent.includes('taste'),'Choosing another learner meaning updates the main definition');
      escape(); segment.textContent = 'An eco-friendly company specifically for you'; await tick();
      document.querySelector('#results').textContent = `${results.join('\n')}\n${results.length}/${results.length} checks passed (${document.fullscreenElement ? 'fullscreen' : 'normal'})`;
      document.querySelector('#screen-state').textContent += ` — ${results.length} checks passed`;
    } catch (error) {
      document.querySelector('#results').textContent = results.join('\n') + '\nFAIL ' + error.message;
      document.querySelector('#screen-state').textContent = 'FAIL ' + error.message;
    }
  };
</script>
</html>
